<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" role="img" aria-label="Jobak stat post">
  <!--
    LinkedIn square post — 1080 x 1080. Squares take more vertical space in the
    feed than 1.91:1, so this template is for the posts worth that space: one
    number, stated plainly.

    Replace the stat, its label and the support line. The stat block below is
    the dashboard's own Stat component at poster scale, which is the point —
    the feed and the product should look like the same company.
  -->
  <defs>
    <radialGradient id="wash" cx="76%" cy="14%" r="66%">
      <stop offset="0%" stop-color="#58e68c" stop-opacity="0.18"/>
      <stop offset="72%" stop-color="#58e68c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.014"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="#08090a"/>
  <rect width="1080" height="1080" fill="url(#wash)"/>

  <g transform="translate(88, 88)">
    <path d="M42 12 V38 A10 10 0 0 1 22 38" stroke="#58e68c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="22" r="5.5" fill="#58e68c"/>
  </g>
  <text x="137" y="138" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="-1.2" fill="#f7f8f8">obak</text>

  <!-- Stat card — REPLACE value + label -->
  <rect x="88" y="300" width="904" height="330" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="136" y="374" font-family="'Geist Mono', ui-monospace, monospace" font-size="17" letter-spacing="3.4" fill="#8a8f98">AVERAGE MATCH SCORE</text>
  <text x="136" y="510" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="140" font-weight="600" letter-spacing="-6" fill="#f7f8f8">74%</text>
  <rect x="136" y="548" width="808" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="136" y="548" width="598" height="8" rx="4" fill="#58e68c"/>
  <text x="136" y="596" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#8a8f98">across every listing scored on a user&#39;s own key</text>

  <!-- Headline — REPLACE -->
  <text font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="600" letter-spacing="-2" fill="#f7f8f8">
    <tspan x="88" y="762">Stop reading job boards.</tspan>
    <tspan x="88" y="826">Read the four that fit.</tspan>
  </text>

  <line x1="88" y1="928" x2="992" y2="928" stroke="url(#rule)" stroke-width="1"/>
  <circle cx="92" cy="972" r="4.5" fill="#58e68c"/>
  <text x="112" y="979" font-family="'Geist Mono', ui-monospace, monospace" font-size="17" letter-spacing="3.2" fill="#8a8f98">JOBAK.IO</text>
</svg>
