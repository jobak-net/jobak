<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" fill="none" role="img" aria-label="Jobak — jobs worth applying to">
  <!--
    LinkedIn personal profile cover — 1584 x 396.

    The profile photo sits bottom-left over roughly the first 260px and the
    lower 150px, so the composition is anchored to the upper-right and nothing
    load-bearing enters that corner.
  -->
  <defs>
    <radialGradient id="wash" cx="70%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#58e68c" stop-opacity="0.22"/>
      <stop offset="72%" stop-color="#58e68c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0 H0 V72" fill="none" stroke="#58e68c" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridfade" cx="66%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1584" height="396" fill="url(#gridfade)"/></mask>
  </defs>

  <rect width="1584" height="396" fill="#08090a"/>
  <rect width="1584" height="396" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1584" height="396" fill="url(#wash)"/>

  <g transform="translate(560, 118) scale(1.5)">
    <path d="M42 12 V38 A10 10 0 0 1 22 38" stroke="#58e68c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="22" r="5.5" fill="#58e68c"/>
  </g>

  <text x="634" y="176" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="60" font-weight="600" letter-spacing="-2.1" fill="#f7f8f8">obak</text>
  <line x1="588" y1="204" x2="1360" y2="204" stroke="url(#rule)" stroke-width="1"/>
  <text x="588" y="240" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#d0d6e0">Jobs worth applying to, scored against your own profile.</text>
  <text x="588" y="276" font-family="'Geist Mono', ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#8a8f98">JOBAK.IO</text>
</svg>
