<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" fill="none" role="img" aria-label="Jobak announcement post">
  <!--
    LinkedIn single-image post — 1200 x 627 (1.91:1, the ratio LinkedIn keeps
    uncropped in the feed).

    A template: replace the headline and the eyebrow. Everything else — the
    palette, the mark, the rule, the footer — is fixed so a run of posts reads
    as one voice. Keep the headline under about 60 characters or it will need a
    third line and collide with the footer rule.
  -->
  <defs>
    <radialGradient id="wash" cx="80%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#58e68c" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#58e68c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="#08090a"/>
  <rect width="1200" height="627" fill="url(#wash)"/>

  <!-- Mark + wordmark -->
  <g transform="translate(80, 72)">
    <path d="M42 12 V38 A10 10 0 0 1 22 38" stroke="#58e68c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="22" r="5.5" fill="#58e68c"/>
  </g>
  <text x="129" y="122" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="-1.2" fill="#f7f8f8">obak</text>

  <!-- Eyebrow — REPLACE -->
  <text x="80" y="286" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" letter-spacing="3.4" fill="#58e68c">NEW IN JOBAK</text>

  <!-- Headline — REPLACE -->
  <text font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="66" font-weight="600" letter-spacing="-2.4" fill="#f7f8f8">
    <tspan x="80" y="366">Apply with AI, straight</tspan>
    <tspan x="80" y="440">from the job you opened.</tspan>
  </text>

  <!-- Support line — REPLACE -->
  <text x="80" y="492" font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#8a8f98">CV review, tailored bullets, cover letter and an email to HR.</text>

  <line x1="80" y1="546" x2="1120" y2="546" stroke="url(#rule)" stroke-width="1"/>
  <circle cx="84" cy="580" r="4" fill="#58e68c"/>
  <text x="100" y="586" font-family="'Geist Mono', ui-monospace, monospace" font-size="15" letter-spacing="3" fill="#8a8f98">JOBAK.IO</text>
</svg>
