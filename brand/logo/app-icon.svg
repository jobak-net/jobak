<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!--
    App icon: the homepage J, in accent green, on the canvas colour.

    Full bleed and square on purpose. iOS and Android launchers cut their own
    shape (squircle, circle, teardrop) from an app icon; rounding it here as
    well would leave slivers where the two radii disagree. The J is scaled to
    68% and centred, which keeps it inside Android's 80% maskable safe zone, so
    this one file serves both the plain and the maskable icon.

    Source for src/app/apple-icon.tsx and scripts/icons/generate-icons.ts.
  -->
  <rect width="64" height="64" fill="#08090a"/>
  <g transform="translate(32 32) scale(0.68) translate(-32 -30)">
    <path d="M42 12 V38 A10 10 0 0 1 22 38" stroke="#58e68c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="22" r="5.5" fill="#58e68c"/>
  </g>
</svg>
