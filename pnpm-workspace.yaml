packages: []

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
overrides:
  postcss@<8.5.10: '>=8.5.10'
  # Stay on the 1.x line: an unbounded '>=1.1.18' resolves to brace-expansion
  # 5.x, which minimatch@3 cannot call — that breaks ESLint. (pnpm 9 reads the
  # overrides in package.json; keep the two in step.)
  brace-expansion@1: '^1.1.18'
